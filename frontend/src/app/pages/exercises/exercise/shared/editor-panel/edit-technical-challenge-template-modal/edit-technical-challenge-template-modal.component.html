<div class="modal-header">
    <h4 class="modal-title">
        Vorlage der Technischen Herausforderung bearbeiten
        <app-help-button
            url="2_exercises/3_exercise_elements.html#technische-herausforderungen"
            [trainerOnly]="false"
        />
    </h4>
    <button type="button" class="btn-close" (click)="close()"></button>
</div>
<div class="modal-body">
    <app-technical-challenge-template-form
        [technicalChallengeTemplate]="technicalChallengeTemplate()"
        (technicalChallengeTemplateChange)="
            updateTechnicalChallengeTemplate($event)
        "
    >
    </app-technical-challenge-template-form>
</div>
