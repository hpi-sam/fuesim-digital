version: 2
versioning-strategy: increase
updates:
    - package-ecosystem: 'npm'
      versioning-strategy: increase
      directories:
          - '/'
          - '/backend'
          - '/benchmark'
          - '/frontend'
          - '/shared'
      schedule:
          interval: 'daily'
      groups:
          angular:
              applies-to: version-updates
              update-types:
                  - minor
                  - patch
              patterns:
                  - '@angular*'
                  - '@ng-bootstrap*'
                  - '@ngrx*'
                  - 'ng-qrcode'
                  - 'angular-eslint'

    - package-ecosystem: 'github-actions'
      directory: '/'
      schedule:
          interval: 'weekly'
