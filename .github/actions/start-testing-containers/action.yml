name: Start Testing Containers
description: Starts an Authelia and a Garage instance for testing purposes
runs:
    using: composite
    steps:
        - name: Start Authelia Docker container
          run: |
              export AUTHELIA_CONTAINER_ID=$(docker run -p 9091/tcp -v ${GITHUB_WORKSPACE}/docker/authelia-config:/config -v authelia-secrets:/secrets -d docker.io/authelia/authelia:4.39.16)
              export AUTHELIA_CONTAINER_PORT=$(docker port $AUTHELIA_CONTAINER_ID 9091/tcp | grep 0.0.0.0 | cut -c 9-)
              echo "Authelia container started with ID $AUTHELIA_CONTAINER_ID on port $AUTHELIA_CONTAINER_PORT"
              echo "AUTHELIA_CONTAINER_ID=$AUTHELIA_CONTAINER_ID" >> "$GITHUB_ENV"
              echo "AUTHELIA_CONTAINER_PORT=$AUTHELIA_CONTAINER_PORT" >> "$GITHUB_ENV"
          shell: bash
        - name: Start Garage Docker container
          run: |
              export GARAGE_CONTAINER_ID=$(docker run -p 9092/tcp -v ${GITHUB_WORKSPACE}/docker/garage.toml:/etc/garage.toml:ro -v garage-meta:/var/lib/garage/meta -v garage-data:/var/lib/garage/data -e GARAGE_DEFAULT_ACCESS_KEY=fuesim-digital-key -e GARAGE_DEFAULT_SECRET_KEY=fuesim-digital-key -e GARAGE_DEFAULT_BUCKET=fuesim-digital -d docker.io/dxflrs/garage:v2.3.0)
              export GARAGE_CONTAINER_PORT=$(docker port $GARAGE_CONTAINER_ID 9092/tcp | grep 0.0.0.0 | cut -c 9-)
              echo "Garage container started with ID $GARAGE_CONTAINER_ID on port $GARAGE_CONTAINER_PORT"
              echo "GARAGE_CONTAINER_ID=$GARAGE_CONTAINER_ID" >> "$GITHUB_ENV"
              echo "GARAGE_CONTAINER_PORT=$GARAGE_CONTAINER_PORT" >> "$GITHUB_ENV"
          shell: bash
