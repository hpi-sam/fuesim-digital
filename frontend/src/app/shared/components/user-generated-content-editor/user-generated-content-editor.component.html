@if (this.currentRole() === 'trainer') {
    <div>
        <div class="NgxEditor__Wrapper mb-2">
            <ngx-editor-menu
                [editor]="editor"
                [toolbar]="toolbar"
                [customMenuRef]="customMenu"
            >
            </ngx-editor-menu>
            <ngx-editor
                [editor]="editor"
                [(ngModel)]="editorContent"
                [placeholder]="'Hier Erkundungsinformationen eingeben ...'"
            >
            </ngx-editor>
        </div>
        <ng-template #customMenu>
            <div class="NgxEditor__Seperator"></div>
            <button
                class="btn btn-outline-primary btn-sm"
                (click)="chooseImageFromCollection()"
            >
                Bild einfügen
            </button>
        </ng-template>
        <div>
            @if (isChanged()) {
                <button class="btn btn-primary" (click)="submit()">
                    Speichern
                </button>
            } @else {
                <button class="btn btn-outline-success" disabled>
                    Gespeichert
                    <i class="bi bi-check"></i>
                </button>
            }
        </div>
    </div>
} @else {
    <div [innerHTML]="editorContent()" class="user-generated-content p-2"></div>
}
