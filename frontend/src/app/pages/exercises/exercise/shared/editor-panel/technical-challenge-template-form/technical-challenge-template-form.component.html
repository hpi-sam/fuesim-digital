<div class="form-group">
    <label class="form-label">Name der Technischen Herausforderung:</label>
    <input class="form-control" type="text" [formField]="templateForm.name" />
</div>

<div class="form-group mt-2">
    <label class="form-label">Beinhaltete Teilherausforderungen: </label>
    <div class="d-flex flex-row gap-2">
        @for (
            stateMachine of templateForm.stateMachines().value();
            track stateMachine.id
        ) {
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">{{ stateMachine.name }}</h5>
                    <a
                        (click)="editStateMachine(stateMachine)"
                        class="btn btn-primary stretched-link"
                    >
                        Bearbeiten
                    </a>
                </div>
            </div>
        }
    </div>
</div>
