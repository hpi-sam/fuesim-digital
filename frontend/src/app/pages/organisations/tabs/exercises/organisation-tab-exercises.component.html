@if (organisation().userRole !== 'viewer') {
    <div class="d-flex align-items-center mt-2 gap-2">
        <button class="btn btn-primary" (click)="createExercise()">
            Neue Übung erstellen
        </button>

        <app-help-button url="4_editing/index.html#übungen-verwalten" />
        <div class="flex-grow-1"></div>

        <label class="btn btn-outline-primary my-2">
            <i class="bi-cloud-upload me-2"> </i>
            Übung importieren
            <input
                (appFileInput)="createExercise($event)"
                type="file"
                accept="application/json"
                class="d-none"
            />
        </label>
    </div>
}
@if (exercises()) {
    <div class="row row-cols-3 mt-2">
        @for (exercise of exercises(); track exercise.id) {
            <div class="col mb-4">
                <app-exercise-card [exercise]="exercise" (updated)="reload()" />
            </div>
        } @empty {
            <div class="col flex-grow-1">
                <p class="bg-light p-4 rounded-3 lead mb-0">
                    Es gibt noch keine Übungen.
                </p>
            </div>
        }
    </div>
} @else {
    <div class="row row-cols-3 mt-2">
        @for (_ of [1, 2, 3]; track $index) {
            <div class="col">
                <div class="card" aria-hidden="true">
                    <div class="card-body">
                        <h2 class="card-title h4 placeholder-glow">
                            <span class="placeholder col-6"></span>
                        </h2>
                        <p class="card-text placeholder-glow">
                            <span class="placeholder col-4"></span>
                            <span class="placeholder col-4"></span>
                        </p>
                        <a
                            class="btn btn-primary disabled placeholder col-6"
                            aria-disabled="true"
                        ></a>
                    </div>
                </div>
            </div>
        }
    </div>
}
