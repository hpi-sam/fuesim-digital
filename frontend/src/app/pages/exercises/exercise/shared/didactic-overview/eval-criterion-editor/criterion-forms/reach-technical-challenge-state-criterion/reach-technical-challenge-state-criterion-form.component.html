<form class="ms-2">
    <label>
        Art:
        {{ evalCriterionTypesNames.reachTechnicalChallengeStateEvalCriterion }}
    </label>
    <div>
        @if (technicalChallenges().length === 0) {
            <hr />
            <span class="mt-3 text-muted"
                >Es befinden sich aktuell keine technischen Herausforderungen
                auf der Karte.</span
            >
            <hr />
        } @else {
            <select
                class="form-select"
                [formField]="this.criterionForm.technicalChallengeId"
            >
                <option value="" disabled>
                    Keine Technische Herausforderung ausgewählt
                </option>
                @for (
                    challenge of this.technicalChallenges();
                    track challenge.id
                ) {
                    <option value="{{ challenge.id }}">
                        {{ challenge.name }}
                    </option>
                }
            </select>
        }

        @if (this.criterionForm.technicalChallengeId().value() !== '') {
            <label class="mt-1">
                @let machines = this.stateMachinesOfselectedTechnicalChallenge;
                {{
                    machines()?.length === 1
                        ? 'Ziel Zustand:'
                        : 'Ziel Zustände:'
                }}
                @for (machine of machines(); track machine.id) {
                    {{ machine.name }}:
                    <select class="form-select me-2">
                        <option value="" disabled>
                            Kein Zustand ausgewählt
                        </option>
                        @if (this.stateMachineStates(); as states) {
                            @for (state of states[machine.id]; track $index) {
                                <option
                                    (mousedown)="
                                        selectTargetState(machine.id, state.id)
                                    "
                                >
                                    {{ state.title }}
                                </option>
                            }
                        }
                    </select>
                    <br />
                }
            </label>
        }
    </div>
</form>
