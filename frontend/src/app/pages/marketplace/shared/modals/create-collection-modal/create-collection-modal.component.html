<div class="modal-header">
    <h4 class="modal-title">Neue Sammlung erstellen</h4>
    <button type="button" class="btn-close" (click)="close()"></button>
</div>
<div class="modal-body">
    <form (ngSubmit)="createNewCollection()">
        <div class="form-group mb-2">
            <label class="form-label">Organisation</label>
            <select
                [formField]="collectionCreationForm.organisationId"
                class="form-control"
                [class.placeholder]="organisations.isLoading()"
            >
                @for (org of organisations.value(); track org.id) {
                    <option [value]="org.id">
                        {{ org.name }}
                    </option>
                }
            </select>
            <app-display-model-validation
                [field]="collectionCreationForm.organisationId()"
            />
        </div>

        <div class="form-group mb-2">
            <label class="form-label">Name</label>
            <input
                [formField]="collectionCreationForm.title"
                class="form-control"
                [appAutofocus]="true"
                type="text"
            />
            <app-display-model-validation
                [field]="collectionCreationForm.title()"
            ></app-display-model-validation>
        </div>

        <button
            class="btn btn-primary"
            [disabled]="collectionCreationForm().invalid()"
        >
            Sammlung erstellen
        </button>
    </form>
</div>
