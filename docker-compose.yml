# Development Services
services:
    app:
        # don't start app container per default
        profiles: [app]
        depends_on:
            - authelia
            - db
        build:
            context: .
            dockerfile: docker/Dockerfile
        restart: unless-stopped
        ports:
            - "8080:80"
        env_file: .env
    db:
        image: docker.io/postgres:18
        restart: unless-stopped
        volumes:
            - db:/var/lib/postgresql
        ports:
            - "${DFM_DB_PORT}:5432"
        environment:
            - POSTGRES_USER=${DFM_DB_USER}
            - POSTGRES_PASSWORD=${DFM_DB_PASSWORD}
            - POSTGRES_DB=${DFM_DB_NAME}
    authelia:
        image: docker.io/authelia/authelia:4.39.16
        restart: unless-stopped
        ports:
            - "9091:9091"
        networks:
            default:
                aliases:
                    - authelia.localhost
        volumes:
            - ./docker/authelia-config:/config:ro,z
            - authelia-secrets:/secrets
    garage:
        image: docker.io/dxflrs/garage:v2.3.0
        restart: unless-stopped
        command: "/garage server --single-node --default-bucket"
        environment:
            - GARAGE_DEFAULT_ACCESS_KEY=${DFM_S3_ACCESS_KEY_ID}
            - GARAGE_DEFAULT_SECRET_KEY=${DFM_S3_SECRET_ACCESS_KEY}
            - GARAGE_DEFAULT_BUCKET=${DFM_S3_BUCKET}
        volumes:
            - ./docker/garage.toml:/etc/garage.toml:ro
            - garage-meta:/var/lib/garage/meta
            - garage-data:/var/lib/garage/data
        ports:
            - 127.0.0.1:9092:9092
volumes:
    db:
    authelia-secrets:
    garage-meta:
    garage-data:
